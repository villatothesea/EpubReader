[package]
name = "mireader-reader-epub"
description = "MiReader reader plugin: EPUB 2 and 3 books"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "mireader-reader-epub"
path = "src/main.rs"

[dependencies]
# The host SDK lives in the reader's repository — a sibling folder.
mireader-reader-sdk = { path = "../MimiReader/crates/reader-sdk" }
roxmltree = "0.21"
zip = { version = "7", default-features = false, features = ["deflate-flate2"] }
# zip's deflate needs a flate2 backend; the pure-Rust one.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
mireader-reader-host = { path = "../MimiReader/crates/reader-host" }
tempfile = "3"

# A workspace of its own, so cargo never looks for one in a parent folder.
[workspace]

# The release package's build — fat LTO and one codegen unit, as the main
# exe's `reader-dist`. `stage.ps1 -Dist`.
[profile.reader-dist]
inherits = "release"
lto = "fat"
codegen-units = 1
